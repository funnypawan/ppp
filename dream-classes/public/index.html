<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dream Classes — by Dream Sir</title>
<meta name="theme-color" content="#4f46e5"><link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-512.png"><link rel="stylesheet" href="/css/style.css">
<style>
.wrap{max-width:560px;margin:0 auto;padding:0 14px 96px}
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,#4f46e5,#3730a3);color:#fff;padding:14px}
.topbar .row{max-width:560px;margin:0 auto}
.logo{width:44px;height:44px;border-radius:12px;object-fit:cover}
.bell{position:relative;background:rgba(255,255,255,.15);border:0;color:#fff;width:42px;height:42px;border-radius:12px;font-size:1.15rem}
.bell b{position:absolute;top:-4px;right:-4px;background:#f59e0b;color:#000;font-size:.62rem;border-radius:99px;padding:2px 6px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{flex:1;background:none;border:0;padding:9px 2px 7px;color:var(--muted);font-size:.68rem;font-weight:700}
.bottomnav button span{display:block;font-size:1.25rem}
.bottomnav button.on{color:var(--brand)}
.hero{background:linear-gradient(135deg,#4f46e5,#7c6cf8);color:#fff;border-radius:20px;padding:18px;margin:14px 0}
.tile{display:flex;gap:12px;align-items:center;cursor:pointer}
.tile .ic{width:52px;height:52px;border-radius:14px;background:#eef2ff;display:grid;place-items:center;font-size:1.5rem;flex:none}
[data-theme=dark] .tile .ic{background:#232c4d}
video{width:100%;background:#000;border-radius:14px}
.wm{position:absolute;color:rgba(255,255,255,.55);font-size:.7rem;font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none;transition:all 1s;text-align:center;line-height:1.5;z-index:5}
.qnav{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.qnav button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-weight:700}
.qnav button.ans{background:#dcfce7;border-color:#16a34a}.qnav button.rev{background:#fef3c7;border-color:#f59e0b}.qnav button.cur{outline:2.5px solid var(--brand)}
.opt{display:block;border:1.5px solid var(--line);border-radius:12px;padding:13px;margin:8px 0;cursor:pointer}
.opt.sel{border-color:var(--brand);background:#eef2ff}[data-theme=dark] .opt.sel{background:#232c4d}
.opt.right{border-color:var(--ok);background:#dcfce7;color:#14532d}.opt.wrong{border-color:var(--bad);background:#fee2e2;color:#7f1d1d}
iframe.pdf{width:100%;height:68vh;border:1px solid var(--line);border-radius:14px;background:#fff}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--brand)}
h2.sec{font-size:1.05rem;margin:20px 0 10px}
.authbox{max-width:420px;margin:6vh auto;padding:0 16px}
.chip{display:inline-block;border:1.5px solid var(--line);border-radius:99px;padding:7px 14px;margin:3px;cursor:pointer;font-size:.85rem}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
</style></head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
let TOKEN=localStorage.getItem('dc_token')||'', USER=null, VIEW='home', STRUCT=null, TEST=null, DEFERRED=null;
const theme=localStorage.getItem('dc_theme')||'system';
function applyTheme(t){localStorage.setItem('dc_theme',t);document.documentElement.dataset.theme=(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light'}
applyTheme(theme);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e});
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3400)}
function esc(s){return String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
async function api(path,opt={}){opt.headers={...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})};
 const r=await fetch(path,opt); const d=await r.json().catch(()=>({}));
 if(r.status===401&&TOKEN){logout(false);throw new Error(d.error||'Session expired')}
 if(!r.ok) throw new Error(d.message||d.error||'Network error'); return d}
function loading(){$('#main').innerHTML='<div class="spinner"></div><p class="center muted">Loading…</p>'}
function errBox(e,retry){return `<div class="empty"><div class="big">⚠️</div><p>${esc(e.message||e)}</p><br><button class="btn small" onclick="${retry}">↻ Retry</button></div>`}

/* ---------- AUTH ---------- */
function loginView(step='mobile',data={}){
 app.innerHTML=`<div class="authbox"><div class="center"><img src="/icons/icon-512.png" style="width:92px;height:92px;border-radius:22px" alt="Dream Classes logo">
 <h1 style="margin:12px 0 4px">DREAM CLASSES</h1><p class="muted">by <b>Dream Sir</b><br>Kothwara, Dobhi, Gaya, Bihar</p></div>
 <div class="card" style="margin-top:20px"><h3 style="margin-bottom:8px">Student Login / Register</h3>
 ${step==='mobile'?`<label>Mobile Number (10-digit)</label><input id="mob" inputmode="numeric" maxlength="10" placeholder="e.g. 9876543210" value="${esc(data.mobile||'')}">
 <button class="btn" onclick="sendOtp()">Send OTP →</button><p class="muted" style="margin-top:10px;font-size:.78rem">New student? Enter your mobile number — we will create your account after OTP verification.</p>`
 :step==='otp'?`<p class="muted">OTP sent to <b>+91 ${esc(data.mobile)}</b></p>${data.dev?`<div class="card" style="background:#fef3c7;border-color:#f59e0b"><b>Test Mode OTP: ${esc(data.dev)}</b><br><span class="muted">(In production this arrives by SMS/WhatsApp)</span></div>`:''}
 <label>Enter 6-digit OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="------">
 <div id="newuser" style="display:${data.needName?'block':'none'}"><label>Your Full Name (new students)</label><input id="nm" placeholder="e.g. Rahul Kumar">
 <label>Select Your Class</label><select id="cls"><option value="">-- Select --</option>${(data.classes||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
 <button class="btn" onclick="verifyOtp('${esc(data.mobile)}')">Verify & Login ✓</button>
 <button class="btn secondary" style="margin-top:8px" onclick="loginView()">← Change Number</button>`:''}
 </div><p class="center muted" style="font-size:.8rem">Teacher? <a href="/admin">Open Teacher Panel →</a><br><br>
 <a href="#" onclick="staticPage('privacy');return false">Privacy Policy</a> · <a href="#" onclick="staticPage('terms');return false">Terms</a> · <a href="#" onclick="staticPage('help');return false">Help</a></p></div>`;
}
async function sendOtp(){try{const m=$('#mob').value.trim();const d=await api('/api/auth/request-otp',{method:'POST',body:JSON.stringify({mobile:m})});
 const cat=await api('/api/catalog').catch(()=>({classes:[]}));loginView('otp',{mobile:m,dev:d.devOtp,classes:cat.classes})}catch(e){toast(e.message)}}
async function verifyOtp(m){try{const body={mobile:m,code:$('#otp').value.trim(),device_id:navigator.userAgent.slice(0,60)};
 const nm=$('#nm'); if(nm&&$('#newuser').style.display!=='none'){body.name=nm.value.trim();body.class_id=$('#cls').value||null}
 const d=await api('/api/auth/verify-otp',{method:'POST',body:JSON.stringify(body)});
 TOKEN=d.token;localStorage.setItem('dc_token',TOKEN);USER=d.user;boot()}catch(e){
 if(e.message.includes('full name')||e.message.includes('NAME')){$('#newuser').style.display='block';toast('New student — please enter your name & class, then tap Verify again')}else toast(e.message)}}
function logout(notify=true){if(notify&&TOKEN)api('/api/auth/logout',{method:'POST'}).catch(()=>{});TOKEN='';USER=null;localStorage.removeItem('dc_token');loginView()}

/* ---------- SHELL ---------- */
function shell(){
 app.innerHTML=`<div class="topbar"><div class="row between"><div class="row"><img class="logo" src="/icons/icon-512.png">
 <div><b style="font-size:1.02rem">DREAM CLASSES</b><br><small style="opacity:.85">Dream Sir · Gaya, Bihar</small></div></div>
 <button class="bell" onclick="go('notifications')">🔔<b id="belln" style="display:none">0</b></button></div></div>
 <div class="wrap"><div id="main"></div></div>
 <nav class="bottomnav">${[['home','🏠','Home'],['classes','📚','My Classes'],['tests','📝','Tests'],['doubts','💬','Doubts'],['profile','👤','Profile']].map(([v,i,l])=>`<button data-v="${v}" onclick="go('${v}')"><span>${i}</span>${l}</button>`).join('')}</nav>`;
 updateBell();
}
function go(v){VIEW=v;document.querySelectorAll('.bottomnav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));({home:homeView,classes:classesView,tests:testsView,doubts:doubtsView,profile:profileView,notifications:notifView}[v]||homeView)();window.scrollTo(0,0)}
async function updateBell(){try{const d=await api('/api/notifications');const n=d.notifications.filter(x=>!x.read).length;const b=$('#belln');if(b){b.style.display=n?'block':'none';b.textContent=n}}catch{}}

/* ---------- HOME ---------- */
async function homeView(){loading();try{
 if(USER.status!=='APPROVED'){$('#main').innerHTML=`<div class="empty"><div class="big">⏳</div><h3>Approval Pending</h3><p>Namaste ${esc(USER.name)}! Your registration is waiting for approval by <b>Dream Sir</b>. You will get full access once approved.</p><br><button class="btn small secondary" onclick="logout()">Logout</button></div>`;return}
 const [d,ann]=await Promise.all([api('/api/dashboard'),api('/api/announcements')]);
 $('#main').innerHTML=`<div class="hero"><small>Namaste 🙏</small><h2>${esc(USER.name)}</h2>
 <p style="opacity:.9;font-size:.88rem">Course Progress: ${d.completed}/${d.totalVideos} lectures (${d.coursePct}%)</p>
 <div class="progressbar" style="background:rgba(255,255,255,.3);margin-top:8px"><i style="width:${d.coursePct}%;background:#f59e0b"></i></div></div>
 ${ann.announcements.length?`<h2 class="sec">📢 Announcements</h2>${ann.announcements.slice(0,3).map(a=>`<div class="card"><b>${esc(a.title)}</b><p class="muted">${esc(a.body)}</p></div>`).join('')}`:''}
 <div class="grid2"><div class="card center"><h2>${d.attempts}</h2><p class="muted">Tests Attempted</p></div><div class="card center"><h2>${d.avgPct}%</h2><p class="muted">Avg Score · Best ${d.bestPct}%</p></div>
 <div class="card center"><h2>${d.pendingDoubts}</h2><p class="muted">Pending Doubts</p></div><div class="card center"><h2>${d.resolvedDoubts}</h2><p class="muted">Doubts Resolved</p></div></div>
 <h2 class="sec">▶️ Continue Learning</h2>${d.recent.length?d.recent.map(v=>`<div class="card tile" onclick="playVideo(${v.id})"><div class="ic">🎬</div><div style="flex:1"><b>${esc(v.title)}</b><br><span class="muted">${v.completed?'✅ Completed':'Resume from '+Math.floor(v.position_sec/60)+'m '+(v.position_sec%60)+'s'}</span></div>›</div>`).join(''):'<div class="empty"><div class="big">🎬</div><p>No lectures watched yet.<br>Go to <b>My Classes</b> to start learning!</p></div>'}
 <h2 class="sec">📄 Latest Notes</h2>${d.latestNotes.length?d.latestNotes.map(p=>`<div class="card tile" onclick="openPdf(${p.id},'${esc(p.title)}')"><div class="ic">📄</div><div><b>${esc(p.title)}</b></div></div>`).join(''):'<p class="muted">No notes uploaded yet.</p>'}
 <h2 class="sec">📅 Upcoming Tests</h2>${(d.upcomingTests||[]).length?d.upcomingTests.map(t=>`<div class="card tile" onclick="go('tests')"><div class="ic">📝</div><div style="flex:1"><b>${esc(t.title)}</b><br><span class="muted">${t.state==='SCHEDULED'?'Opens '+(t.starts_at||'soon'):'Open now'} · ${t.duration_min} min</span></div>›</div>`).join(''):'<p class="muted">No upcoming tests.</p>'}
 ${(d.subjectPerformance||[]).length?`<h2 class="sec">📊 Subject-wise Performance</h2><div class="card">${d.subjectPerformance.map(s=>`<div style="margin:8px 0"><div class="row between"><b>${esc(s.subject)}</b><span class="muted">${s.pct||0}% · ${s.attempts} test(s)</span></div><div class="progressbar"><i style="width:${s.pct||0}%"></i></div></div>`).join('')}<p class="muted" style="margin-top:6px">Practice questions solved: <b>${d.practice?.correct||0}/${d.practice?.answered||0}</b> correct</p></div>`:''}
 <h2 class="sec">📥 My Downloads (Offline)</h2><div class="card tile" onclick="downloadsView()"><div class="ic">📥</div><div style="flex:1"><b>Downloaded Lessons & Notes</b><br><span class="muted">Watch/read without internet — stored privately in this app</span></div>›</div>
 <h2 class="sec">🏆 Recent Results</h2>${d.results.length?d.results.map(r=>`<div class="card row between"><span>${esc(r.title)}</span><b>${r.score}/${r.total}</b></div>`).join(''):'<p class="muted">No test results yet.</p>'}`;
}catch(e){$('#main').innerHTML=errBox(e,'homeView()')}}

/* ---------- CLASSES ---------- */
async function classesView(){loading();try{
 if(!STRUCT) STRUCT=(await api('/api/structure')).classes;
 $('#main').innerHTML=`<h2 class="sec">📚 My Classes</h2>`+(STRUCT.length?STRUCT.map(c=>`<div class="card"><h3>${esc(c.name)}</h3><div style="margin-top:10px">${c.subjects.map(s=>`<div class="tile" style="padding:9px 0;border-bottom:1px solid var(--line)" onclick="subjectView(${c.id},${s.id})"><div class="ic">${esc(s.icon||'📚')}</div><div style="flex:1"><b>${esc(s.name)}</b><br><span class="muted">${s.chapters.length} chapters</span></div>›</div>`).join('')||'<p class="muted">No subjects yet</p>'}</div></div>`).join(''):'<div class="empty"><div class="big">📚</div><p>No classes published yet.</p></div>');
}catch(e){$('#main').innerHTML=errBox(e,'classesView()')}}
function subjectView(cid,sid){const c=STRUCT.find(x=>x.id===cid),s=c.subjects.find(x=>x.id===sid);
 $('#main').innerHTML=`<button class="btn small secondary" onclick="classesView()">← Back</button><h2 class="sec">${esc(s.icon||'')} ${esc(s.name)} · ${esc(c.name)}</h2>`+
 (s.chapters.length?s.chapters.map((ch,i)=>`<div class="card tile" onclick="chapterView(${ch.id},'${esc(ch.name)}')"><div class="ic">${i+1}</div><div style="flex:1"><b>${esc(ch.name)}</b>${ch.description?`<br><span class="muted">${esc(ch.description)}</span>`:''}</div>›</div>`).join(''):'<div class="empty"><div class="big">📖</div><p>Chapters coming soon.</p></div>')}
async function chapterView(id,name){loading();try{const d=await api('/api/chapters/'+id+'/content');
 $('#main').innerHTML=`<button class="btn small secondary" onclick="classesView()">← Back</button><h2 class="sec">📖 ${esc(name)}</h2>
 <h3 style="margin:12px 0 8px">🎬 Video Lectures</h3>${d.videos.length?d.videos.map(v=>`<div class="card tile" onclick="playVideo(${v.id})">${v.thumbnail?`<img src="${esc(v.thumbnail)}" style="width:72px;height:52px;object-fit:cover;border-radius:12px">`:'<div class="ic">▶️</div>'}<div style="flex:1"><b>${esc(v.title)}</b><br><span class="muted">${v.progress?.completed?'✅ Completed':v.progress?'▶ Resume':'Not started'}${v.downloadable?' · ⬇ Downloadable':''}</span></div></div>`).join(''):'<p class="muted">No lectures yet.</p>'}
 <h3 style="margin:16px 0 8px">📄 PDF Notes</h3>${d.pdfs.length?d.pdfs.map(p=>`<div class="card tile" onclick="openPdf(${p.id},'${esc(p.title)}',${p.downloadable})"><div class="ic">📄</div><div style="flex:1"><b>${esc(p.title)}</b></div></div>`).join(''):'<p class="muted">No notes yet.</p>'}
 <h3 style="margin:16px 0 8px">📝 Tests</h3>${d.tests.length?d.tests.map(t=>`<div class="card tile" onclick="go('tests')"><div class="ic">📝</div><div style="flex:1"><b>${esc(t.title)}</b><br><span class="badge">${t.state}</span> <span class="muted">${t.duration_min} min</span></div></div>`).join(''):'<p class="muted">No tests yet.</p>'}
 ${d.practiceCount?`<h3 style="margin:16px 0 8px">✏️ Practice Questions (${d.practiceCount})</h3><div id="practiceBox"><button class="btn secondary" onclick="loadPractice(${id})">Start Practice →</button></div>`:''}`;
}catch(e){$('#main').innerHTML=errBox(e,`chapterView(${id},'${esc(name)}')`)}}

/* ---------- VIDEO PLAYER ---------- */
let WM_TIMER=null,SAVE_TIMER=null;
async function playVideo(id){loading();try{const d=await api('/api/videos/'+id+'/play');
 const isYT=d.video.source_type==='youtube'||/youtube|youtu\.be/.test(d.video.url||'');
 const ytId=isYT?(d.video.url.match(/(?:v=|youtu\.be\/)([\w-]{6,})/)||[])[1]:null;
 $('#main').innerHTML=`<button class="btn small secondary" onclick="go('classes')">← Back</button>
 <div style="position:relative;margin-top:12px" id="pwrap">
 ${isYT?`<iframe width="100%" height="240" style="border-radius:14px;border:0" src="https://www.youtube.com/embed/${ytId}?rel=0&playsinline=1" allowfullscreen allow="accelerometer;autoplay;encrypted-media" title="Lecture"></iframe>`
 :`<video id="vid" controls playsinline controlsList="nodownload" oncontextmenu="return false" src="${esc(d.streamUrl)}"></video>
 <div class="wm" id="wm">DREAM CLASSES<br>${esc(d.watermark.name)} · ${esc(d.watermark.mobile)}</div>`}
 </div><h2 style="margin:12px 0 4px;font-size:1.1rem">${esc(d.video.title)}</h2><p class="muted">${esc(d.video.description||'')}</p>
 ${!isYT?`<div class="row" style="margin:12px 0;flex-wrap:wrap"><span class="muted">Speed:</span>${[0.5,1,1.25,1.5,2].map(s=>`<span class="chip spd" onclick="document.querySelector('#vid').playbackRate=${s};document.querySelectorAll('.spd').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${s}x</span>`).join('')}
 <button class="btn small secondary" onclick="fullScreen()">⛶ Fullscreen</button>
 ${d.video.downloadable?`<button class="btn small secondary" id="dlBtn" onclick="downloadVideoOffline(${id},'${esc(d.video.title).replace(/'/g,"\\'")}')">📥 Save Offline</button>`:''}</div>
 ${(d.video.qualities||[]).length?`<div class="row" style="margin:4px 0 10px;flex-wrap:wrap"><span class="muted">Quality:</span><span class="chip ql on" onclick="setQuality(null,this)">Auto/Original</span>${d.video.qualities.map(q=>`<span class="chip ql" onclick="setQuality('${esc(q.url)}',this)">${esc(q.label)}</span>`).join('')}</div>`:''}
 <p class="muted" id="vstat">Resume position: ${d.resumeAt}s</p>`:''}
 <div class="row" style="margin-top:14px">${d.prev?`<button class="btn secondary" onclick="playVideo(${d.prev.id})">⏮ Previous</button>`:''}${d.next?`<button class="btn" onclick="playVideo(${d.next.id})">Next Lecture ⏭</button>`:''}</div>
 <p class="muted" style="margin-top:12px;font-size:.78rem">🔒 Protected lecture — your name & masked mobile are watermarked. Sharing recordings is prohibited.</p>`;
 const v=$('#vid'); window._origSrc=d.streamUrl;
 if(v&&/\.m3u8/.test(d.streamUrl||'')&&window.Hls&&Hls.isSupported()&&!v.canPlayType('application/vnd.apple.mpegurl')){const h=new Hls();h.loadSource(d.streamUrl);h.attachMedia(v);window._hls=h}
 if(v){v.addEventListener('loadedmetadata',()=>{if(d.resumeAt>5&&d.resumeAt<v.duration-10)v.currentTime=d.resumeAt});
  clearInterval(SAVE_TIMER);SAVE_TIMER=setInterval(()=>{if(v&&!v.paused)api('/api/progress',{method:'POST',body:JSON.stringify({video_id:id,position_sec:v.currentTime,completed:v.duration&&v.currentTime/v.duration>0.9})}).catch(()=>{})},8000);
  v.addEventListener('ended',()=>api('/api/progress',{method:'POST',body:JSON.stringify({video_id:id,position_sec:v.currentTime,completed:true})}).catch(()=>{}));
  const wm=$('#wm');const move=()=>{if(!wm)return;wm.style.left=(5+Math.random()*55)+'%';wm.style.top=(8+Math.random()*65)+'%'};move();clearInterval(WM_TIMER);WM_TIMER=setInterval(move,6000)}
}catch(e){$('#main').innerHTML=errBox(e,'go("classes")')}}
function fullScreen(){const w=$('#pwrap');if(w.requestFullscreen)w.requestFullscreen()}

/* ---------- PDF (PDF.js in-app reader: page nav, zoom, resume, watermark) ---------- */
let PDFDOC=null,PDFPAGE=1,PDFSCALE=1.2,PDFID=null;
async function renderPdfPage(){if(!PDFDOC)return;const page=await PDFDOC.getPage(PDFPAGE);const vp=page.getViewport({scale:PDFSCALE});
 const cv=$('#pdfCanvas');if(!cv)return;cv.width=vp.width;cv.height=vp.height;
 await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
 const st=$('#pdfStat');if(st)st.textContent=`Page ${PDFPAGE} / ${PDFDOC.numPages}`;
 api('/api/pdfs/'+PDFID+'/progress',{method:'POST',body:JSON.stringify({page:PDFPAGE})}).catch(()=>{})}
function pdfNav(d){if(!PDFDOC)return;PDFPAGE=Math.min(Math.max(1,PDFPAGE+d),PDFDOC.numPages);renderPdfPage()}
function pdfZoom(f){PDFSCALE=Math.min(3,Math.max(.5,PDFSCALE*f));renderPdfPage()}
async function openPdf(id,title,dl=1,offlineBlob=null){loading();PDFID=id;try{
 const pr=offlineBlob?{page:1}:await api('/api/pdfs/'+id+'/progress').catch(()=>({page:1}));PDFPAGE=pr.page||1;PDFSCALE=1.2;
 $('#main').innerHTML=`<button class="btn small secondary" onclick="go('classes')">← Back</button><h2 class="sec">📄 ${esc(title)}</h2>
 <div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:8px">
 <button class="btn small secondary" onclick="pdfNav(-1)">◀ Prev</button><button class="btn small secondary" onclick="pdfNav(1)">Next ▶</button>
 <button class="btn small secondary" onclick="pdfZoom(1.2)">🔍＋</button><button class="btn small secondary" onclick="pdfZoom(0.85)">🔍－</button>
 <span class="muted" id="pdfStat">Loading…</span></div>
 <div style="position:relative;overflow:auto;border:1px solid var(--line);border-radius:14px;background:#525659;user-select:none" oncontextmenu="return false">
 <canvas id="pdfCanvas" style="display:block;margin:0 auto;max-width:none"></canvas>
 <div class="wm" style="position:absolute;left:8px;bottom:8px;color:rgba(255,255,255,.75)">DREAM CLASSES · ${esc(USER.name)} · ${esc(USER.maskedMobile||'')}</div></div>

/* ---------- OFFLINE DOWNLOADS (IndexedDB, app-private in the browser) ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('dream-classes',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'key'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(key,val){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('files','readwrite');t.objectStore('files').put({key,...val});t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbAll(){const db=await idb();return new Promise((res,rej)=>{const rq=db.transaction('files').objectStore('files').getAll();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error)})}
async function idbDel(key){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('files','readwrite');t.objectStore('files').delete(key);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function downloadPdfOffline(id,title){toast('Downloading for offline… ⏳');
 try{const r=await fetch('/api/pdfs/'+id+'/file?download=1',{headers:{Authorization:'Bearer '+TOKEN}});if(!r.ok)throw new Error('Download failed');
 const blob=await r.blob();await idbPut('pdf-'+id,{type:'pdf',refId:id,title,blob,savedAt:Date.now()});toast('Saved offline ✓ Find it in My Downloads')}catch(e){toast(e.message)}}
async function downloadVideoOffline(id,title){const btn=$('#dlBtn');if(btn){btn.disabled=true;btn.textContent='⏳ Downloading…'}
 try{const d=await api('/api/videos/'+id+'/play');const url=d.video.source_type==='upload'?d.streamUrl:(d.video.url||d.streamUrl);
 const r=await fetch(url);if(!r.ok)throw new Error('Download failed');const blob=await r.blob();
 await idbPut('video-'+id,{type:'video',refId:id,title,blob,savedAt:Date.now()});toast('Lecture saved offline ✓');if(btn)btn.textContent='✔ Saved Offline'}
 catch(e){toast('Offline download failed: '+e.message);if(btn){btn.disabled=false;btn.textContent='📥 Save Offline'}}}

 $('#main').innerHTML=`<button class="btn small secondary" onclick="go('home')">← Home</button><h2 class="sec">📥 My Downloads</h2>

 (items.length?items.map(it=>`<div class="card tile"><div class="ic">${it.type==='pdf'?'📄':'🎬'}</div><div style="flex:1"><b>${esc(it.title)}</b><br><span class="muted">${it.type==='pdf'?'Notes':'Lecture'} · ${(it.blob.size/1048576).toFixed(1)} MB · ${new Date(it.savedAt).toLocaleDateString()}</span></div>

 <button class="btn small danger" onclick="deleteOffline('${it.key}')">🗑</button></div>`).join(''):'<div class="empty"><div class="big">📥</div><p>No offline downloads yet.<br>Open a lecture or notes and tap <b>📥 Save Offline</b>.</p></div>');
 }catch(e){$('#main').innerHTML=errBox(e,'downloadsView()')}}
async function openOffline(key){const items=await idbAll();const it=items.find(x=>x.key===key);if(!it)return;
 if(it.type==='pdf')return openPdf(it.refId,it.title,0,it.blob);
 const url=URL.createObjectURL(it.blob);
 $('#main').innerHTML=`<button class="btn small secondary" onclick="downloadsView()">← Downloads</button><h2 class="sec">🎬 ${esc(it.title)} (Offline)</h2>

function setQuality(url,el){const v=$('#vid');if(!v)return;document.querySelectorAll('.ql').forEach(c=>c.classList.remove('on'));el.classList.add('on');
 const t=v.currentTime,wasPlaying=!v.paused;if(window._hls){window._hls.destroy();window._hls=null}
 const src=url||window._origSrc;
 if(/\.m3u8/.test(src)&&window.Hls&&Hls.isSupported()){const h=new Hls();h.loadSource(src);h.attachMedia(v);window._hls=h}else v.src=src;
 v.addEventListener('loadedmetadata',function once(){v.currentTime=t;if(wasPlaying)v.play();v.removeEventListener('loadedmetadata',once)})}

/* ---------- WEB PUSH ---------- */
function b64ToU8(s){const pad='='.repeat((4-s.length%4)%4);const raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
async function enablePush(){try{
 if(!('serviceWorker' in navigator)||!('PushManager' in window))return toast('Push is not supported on this browser');
 const perm=await Notification.requestPermission();if(perm!=='granted')return toast('Permission: '+perm);
 const reg=await navigator.serviceWorker.ready;const {publicKey}=await api('/api/push/key');
 let sub=await reg.pushManager.getSubscription();
 if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(publicKey)});
 await api('/api/push/subscribe',{method:'POST',body:JSON.stringify(sub.toJSON())});
 toast('🔔 Push notifications enabled on this device ✓')}catch(e){toast('Push failed: '+e.message)}}

async function startTest(id){if(!confirm('Start the test now? Timer will begin immediately.'))return;loading();
 try{TEST=await api('/api/tests/'+id+'/start',{method:'POST',body:'{}'});TEST.i=0;TEST.answers=TEST.savedAnswers||{};TEST.review=new Set();renderQ()}catch(e){toast(e.message);testsView()}}
function renderQ(){const t=TEST,q=t.questions[t.i];const left=Math.max(0,t.test.duration_min*60-Math.floor((Date.now()-t.startedAt)/1000));
 $('#main').innerHTML=`<div class="row between"><b>${esc(t.test.title)}</b><span class="timer" id="tmr"></span></div>
 <p class="muted">${esc(t.test.instructions||'')}</p><div class="qnav">${t.questions.map((_,i)=>`<button class="${t.answers[t.questions[i].id]!==undefined?'ans':''} ${t.review.has(i)?'rev':''} ${i===t.i?'cur':''}" onclick="TEST.i=${i};renderQ()">${i+1}</button>`).join('')}</div>
 <div class="card"><p class="muted">Question ${t.i+1} of ${t.questions.length} · ${q.marks} mark(s)</p><h3 style="margin:8px 0">${esc(q.text)}</h3>
 ${q.options.map((o,i)=>`<label class="opt ${+t.answers[q.id]===i?'sel':''}"><input type="radio" name="op" ${+t.answers[q.id]===i?'checked':''} onchange="pick(${q.id},${i})" style="width:auto;margin-right:8px">${String.fromCharCode(65+i)}. ${esc(o)}</label>`).join('')}</div>
 <div class="row"><button class="btn secondary" onclick="if(TEST.i>0){TEST.i--;renderQ()}" ${t.i===0?'disabled':''}>← Prev</button>
 <button class="btn secondary" onclick="TEST.review.has(TEST.i)?TEST.review.delete(TEST.i):TEST.review.add(TEST.i);renderQ()">⭐ Review</button>
 ${t.i<t.questions.length-1?`<button class="btn" onclick="TEST.i++;renderQ()">Next →</button>`:`<button class="btn warn" onclick="submitTest()">Submit ✓</button>`}</div>
 ${t.i===t.questions.length-1?'':'<button class="btn warn" style="margin-top:10px" onclick="submitTest()">Submit Test</button>'}`;
 clearInterval(window._tt);const tick=()=>{const s=Math.max(0,t.test.duration_min*60-Math.floor((Date.now()-t.startedAt)/1000));const el=$('#tmr');if(!el){clearInterval(window._tt);return}el.textContent='⏱ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s<=0){clearInterval(window._tt);toast('Time up! Auto-submitting…');submitTest(true)}};tick();window._tt=setInterval(tick,1000)}
async function pick(qid,i){TEST.answers[qid]=i;api('/api/tests/attempts/'+TEST.attemptId+'/save',{method:'POST',body:JSON.stringify({answers:TEST.answers})}).catch(()=>{});renderQ()}

 <button class="btn secondary" style="margin-top:8px" onclick="go('tests')">Back to Tests</button>`;TEST=null}catch(e){toast(e.message);go('tests')}}
