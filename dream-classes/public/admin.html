<!DOCTYPE html>
<html lang="en" data-theme="light"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dream Classes — Teacher Panel</title><link rel="icon" href="/icons/icon-512.png"><link rel="stylesheet" href="/css/style.css"><script src="/js/app-config.js"></script>
<style>
.layout{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:#131a2c;color:#dbe2f5;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.side button{display:block;width:100%;text-align:left;background:none;border:0;color:#dbe2f5;padding:11px 12px;border-radius:11px;font-weight:600;margin:2px 0}
.side button.on,.side button:hover{background:#4f46e5;color:#fff}
.main{flex:1;padding:20px;max-width:1150px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat h2{font-size:1.6rem}.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--brand);color:var(--brand)}
.menuBtn{display:none}
@media(max-width:820px){.side{position:fixed;left:-250px;z-index:60;transition:.25s}.side.open{left:0}.menuBtn{display:inline-block}}
.chk{display:inline-flex;gap:6px;align-items:center;margin:4px 10px 4px 0;font-size:.88rem}.chk input{width:auto;margin:0}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
let TOKEN=localStorage.getItem('dc_admin')||'',FILE_TOKEN='',FILE_TOKEN_AT=0,USER=null,VIEW='dash',CACHE={};
let API_BASE=(localStorage.getItem('dc_api_base')||window.DC_API_BASE||'').replace(/\/+$/,'');
const B=p=>{if(!p||typeof p!=='string')return p;return p.startsWith('/')?API_BASE+p:p};
const theme=localStorage.getItem('dc_theme')||'system';
document.documentElement.dataset.theme=(theme==='dark'||(theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3400)}
function imgUrl(p){if(!p)return '';if(p.startsWith('/uploads/images/'))return B('/api/files/images/'+p.split('/').pop()+'?ft='+encodeURIComponent(FILE_TOKEN));return B(p)}
function esc(s){return String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
function escJs(s){return esc(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r/g,'\\r').replace(/\n/g,'\\n')}
async function api(p,opt={}){opt.headers={...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})};
 let r;try{r=await fetch(B(p),opt)}catch(e){throw new Error('Server se sampark nahi ho raha. Internet/Render server check karein; free server ko jaagne me 1 minute lag sakta hai.')}
 const d=await r.json().catch(()=>({}));if(r.status===401&&TOKEN&&!p.includes('admin-login')){TOKEN='';FILE_TOKEN='';localStorage.removeItem('dc_admin');loginView()}if(!r.ok){const err=new Error(d.message||d.error||'Error');err.code=d.code||d.error;err.status=r.status;err.data=d;throw err}return d}
async function ensureFileToken(force=false){if(!TOKEN)return '';if(!force&&FILE_TOKEN&&Date.now()-FILE_TOKEN_AT<25*60*1000)return FILE_TOKEN;const d=await api('/api/auth/file-token');FILE_TOKEN=d.fileToken;FILE_TOKEN_AT=Date.now();return FILE_TOKEN}
function main(html){$('#content').innerHTML=html}
function loading(){main('<div class="spinner"></div>')}
async function loadBase(){const [c,s,ch,b]=await Promise.all([api('/api/admin/classes'),api('/api/admin/subjects'),api('/api/admin/chapters'),api('/api/admin/batches')]);
 CACHE={classes:c.items,subjects:s.items,chapters:ch.items,batches:b.items}}
function batchChecks(sel=[]){return (CACHE.batches||[]).map(b=>`<label class="chk"><input type="checkbox" class="bchk" value="${b.id}" ${sel.includes(b.id)?'checked':''}>${esc(b.name)}</label>`).join('')||'<span class="muted">No batches (leave empty = all students)</span>'}
function getBatches(scope){const root=scope?document.querySelector(scope):document;return [...(root||document).querySelectorAll('.bchk:checked')].map(x=>+x.value)}
function chapterOpts(sel){return `<option value="">-- Chapter --</option>`+(CACHE.chapters||[]).map(c=>{const s=(CACHE.subjects||[]).find(x=>x.id===c.subject_id);const cl=s?(CACHE.classes||[]).find(x=>x.id===s.class_id):null;return `<option value="${c.id}" ${+sel===c.id?'selected':''}>${esc(cl?cl.name+' › ':'')}${esc(s?s.name+' › ':'')}${esc(c.name)}</option>`}).join('')}
function modal(html){const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="sheet">${html}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m)}
function closeModal(){$('#modal')?.remove()}

/* AUTH */
function normalizeServerUrl(raw){try{const u=new URL(String(raw||'').trim());if(u.protocol!=='https:')return '';return u.origin}catch{return ''}}
async function checkServerUrl(u){const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),75000);try{const r=await fetch(u+'/api/health',{signal:ctl.signal,cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok!==true||d.app!=='Dream Classes')throw new Error('bad health');return true}finally{clearTimeout(timer)}}
async function saveAdminServer(){const raw=$('#srvUrl').value.trim();if(!raw){localStorage.removeItem('dc_api_base');location.reload();return}const u=normalizeServerUrl(raw);if(!u)return toast('Sahi https Render address dein. GitHub link yahan nahi daalna hai.');const btn=$('#srvBtn');if(btn){btn.disabled=true;btn.textContent='⏳ Checking…'}try{await checkServerUrl(u);localStorage.setItem('dc_api_base',u);toast('Server mil gaya ✓ Panel dobara khul raha hai…');setTimeout(()=>location.reload(),700)}catch{toast('Is address par Dream Classes server nahi mila.');if(btn){btn.disabled=false;btn.textContent='Server Check & Save'}}}
function loginView(){app.innerHTML=`<div style="max-width:400px;margin:8vh auto;padding:0 16px"><div class="center"><img src="/icons/icon-512.png" style="width:84px;height:84px;border-radius:20px"><h1 style="margin:10px 0 2px">DREAM CLASSES</h1><p class="muted">Teacher / Admin Panel<br>Dream Sir · Kothwara, Dobhi, Gaya</p></div>
<div id="setupBox"></div><div class="card"><label>Email</label><input id="em" type="email" autocomplete="username" placeholder="admin@dreamclasses.in"><label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
<button class="btn" id="loginBtn" onclick="doLogin()">Login to Panel →</button><p class="muted center" style="margin-top:10px">Student? <a href="${esc(B('/'))}">Open Student App</a></p></div>
<div class="card"><h3>🌐 Server Address</h3><p class="muted" style="margin:6px 0">Agar panel Android app ke andar khula hai, yahan Render ka https address hona chahiye. Chrome me server ke /admin page par ise khaali chhod sakte hain.</p><input id="srvUrl" value="${esc(API_BASE)}" placeholder="https://dream-classes.onrender.com"><button class="btn small secondary" id="srvBtn" onclick="saveAdminServer()">Server Check & Save</button></div></div>`;checkSetup()}
async function checkSetup(){try{const d=await api('/api/setup/status');const box=$('#setupBox');if(!box||!d.setupRequired)return;box.innerHTML=`<div class="card" style="background:#fef3c7;border-color:#f59e0b;color:#231300"><h3>👋 First-time Teacher Setup</h3><p style="margin:8px 0;font-size:.9rem">Abhi koi Super Admin account nahi bana hai.</p>${d.setupTokenConfigured?`<label style="color:#231300">Setup Token (Render ki ADMIN_SETUP_TOKEN setting se)</label><input id="su-token" type="password" autocomplete="off"><label style="color:#231300">Teacher Name</label><input id="su-name" value="Dream Sir"><label style="color:#231300">Email</label><input id="su-email" type="email" placeholder="admin@dreamclasses.in"><label style="color:#231300">New Password (kam se kam 12 characters)</label><input id="su-pass" type="password" autocomplete="new-password"><label style="color:#231300">Password Dobara</label><input id="su-pass2" type="password" autocomplete="new-password"><button class="btn" id="setupBtn" onclick="doSetup()">Teacher Account Banayein ✓</button>`:`<p style="font-size:.9rem">Server par pehle <b>ADMIN_EMAIL</b> aur <b>ADMIN_PASSWORD</b> (12+ characters) set karke redeploy karein. Koi default password nahi chalega.</p>`}</div>`}catch{}}
async function doSetup(){if($('#su-pass').value!==$('#su-pass2').value)return toast('Dono password ek jaise nahi hain');const btn=$('#setupBtn');if(btn){btn.disabled=true;btn.textContent='⏳ Account ban raha hai…'}try{const d=await api('/api/setup/admin',{method:'POST',headers:{'x-setup-token':$('#su-token').value},body:JSON.stringify({name:$('#su-name').value.trim(),email:$('#su-email').value.trim().toLowerCase(),password:$('#su-pass').value})});TOKEN=d.token;localStorage.setItem('dc_admin',TOKEN);USER=d.user;await ensureFileToken().catch(()=>{});boot()}catch(e){toast(e.message);if(btn){btn.disabled=false;btn.textContent='Teacher Account Banayein ✓'}}}
async function doLogin(){const btn=$('#loginBtn');if(btn){btn.disabled=true;btn.textContent='⏳ Login ho raha hai…'}try{const d=await api('/api/auth/admin-login',{method:'POST',body:JSON.stringify({email:$('#em').value.trim().toLowerCase(),password:$('#pw').value})});TOKEN=d.token;localStorage.setItem('dc_admin',TOKEN);USER=d.user;await ensureFileToken().catch(()=>{});boot()}catch(e){toast(e.message);if(btn){btn.disabled=false;btn.textContent='Login to Panel →'}}}
async function logout(){const old=TOKEN;TOKEN='';FILE_TOKEN='';FILE_TOKEN_AT=0;localStorage.removeItem('dc_admin');if(old){try{await fetch(B('/api/auth/logout'),{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+old},body:'{}'})}catch{}}loginView()}

/* SHELL */
const NAV=[['dash','📊 Dashboard'],['students','👨‍🎓 Students'],['structure','🗂 Classes & Chapters'],['batches','👥 Batches'],['videos','🎬 Videos'],['pdfs','📄 PDF Notes'],['tests','📝 Tests'],['practice','✏️ Practice'],['doubts','💬 Doubts'],['notify','🔔 Notifications'],['settings','⚙️ Settings']];
function shell(){app.innerHTML=`<div class="layout"><aside class="side" id="side"><div class="row" style="margin-bottom:14px"><img src="/icons/icon-512.png" style="width:40px;height:40px;border-radius:10px"><div><b>DREAM CLASSES</b><br><small>${esc(USER.name)} · ${USER.role}</small></div></div>
${NAV.map(([v,l])=>`<button data-v="${v}" onclick="go('${v}')">${l}</button>`).join('')}
<button onclick="toggleTheme()">🌓 Theme</button><button onclick="logout()">🚪 Logout</button></aside>
<div class="main"><button class="btn small secondary menuBtn" onclick="document.querySelector('#side').classList.toggle('open')">☰ Menu</button><div id="content"></div></div></div>`}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('dc_theme',t)}
function go(v){VIEW=v;document.querySelectorAll('.side button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#side').classList.remove('open');
 ({dash:dashView,students:studentsView,structure:structureView,batches:batchesView,videos:videosView,pdfs:pdfsView,tests:testsView,practice:practiceView,doubts:doubtsAdmin,notify:notifyView,settings:settingsView}[v])()}

/* DASHBOARD */
async function dashView(){loading();try{const [d,w]=await Promise.all([api('/api/admin/stats'),api('/api/admin/weekly').catch(()=>({days:[]}))]);
 const maxW=Math.max(1,...w.days.map(x=>x.registrations+x.submissions+x.doubts));
 const weeklyHtml=`<div class="card" style="margin-top:16px"><h3>📈 Last 7 Days Activity</h3><div style="display:flex;gap:10px;align-items:flex-end;height:130px;margin-top:14px">${w.days.map(x=>{const tot=x.registrations+x.submissions+x.doubts;return `<div style="flex:1;text-align:center"><div title="Reg ${x.registrations} · Tests ${x.submissions} · Doubts ${x.doubts}" style="margin:0 auto;width:70%;max-width:38px;height:${Math.max(4,tot/maxW*95)}px;background:linear-gradient(180deg,#7c6cf8,#4f46e5);border-radius:8px 8px 0 0"></div><small class="muted">${x.date.slice(5)}<br><b>${tot}</b></small></div>`}).join('')}</div><p class="muted" style="margin-top:8px">Bar = registrations + test submissions + doubts that day. Hover/tap for breakup.</p></div>`;
 const S=(l,v,i)=>`<div class="stat"><p class="muted">${i} ${l}</p><h2>${v}</h2></div>`;
 main(`<h1 style="margin-bottom:14px">📊 Master Dashboard</h1><div class="stats">
 ${S('Total Students',d.totalStudents,'👨‍🎓')}${S('Active',d.active,'✅')}${S('Pending Approvals',d.pending,'⏳')}${S('Blocked',d.blocked,'🚫')}
 ${S('Classes',d.classes,'🏫')}${S('Subjects',d.subjects,'📚')}${S('Chapters',d.chapters,'📖')}${S('Batches',d.batches,'👥')}
 ${S('Videos',d.videos,'🎬')}${S('PDF Notes',d.pdfs,'📄')}${S('Tests',d.tests,'📝')}${S('Test Attempts',d.attempts,'🏆')}
 ${S('Pending Doubts',d.pendingDoubts,'💬')}${S('Doubts Answered',d.answeredDoubts,'✔️')}</div>
 <div class="grid2" style="margin-top:16px">
 <div class="card"><h3>🆕 Recent Registrations</h3>${d.recentStudents.map(s=>`<p style="margin-top:7px">${esc(s.name)} <span class="badge ${s.status==='APPROVED'?'ok':'warn'}">${s.status}</span><br><small class="muted">${esc(s.mobile||'')} · ${esc((s.created_at||'').slice(0,10))}</small></p>`).join('')||'<p class="muted">No students yet</p>'}</div>
 <div class="card"><h3>🏆 Recent Submissions</h3>${d.recentSubmissions.map(s=>`<p style="margin-top:7px">${esc(s.name)} — ${esc(s.title)}: <b>${s.score}/${s.total}</b></p>`).join('')||'<p class="muted">None yet</p>'}
 <h3 style="margin-top:14px">💬 Recent Doubts</h3>${d.recentDoubts.map(s=>`<p style="margin-top:7px">${esc(s.name)}: ${esc(s.question.slice(0,60))} <span class="badge">${s.status}</span></p>`).join('')||'<p class="muted">None yet</p>'}</div></div>`+weeklyHtml)}catch(e){main('<div class="empty">⚠️ '+esc(e.message)+'</div>')}}

/* STUDENTS */
async function studentsView(q=''){loading();await loadBase().catch(()=>{});try{const d=await api('/api/admin/students'+(q?'?'+q:''));
 main(`<h1>👨‍🎓 Students</h1><div class="row" style="flex-wrap:wrap;margin:12px 0"><input id="sq" placeholder="Search name / mobile…" style="max-width:240px;margin:0">
 <select id="sst" style="max-width:180px;margin:0"><option value="">All Status</option>${['PENDING','APPROVED','BLOCKED','SUSPENDED','REJECTED'].map(s=>`<option>${s}</option>`).join('')}</select>
 <select id="scl" style="max-width:170px;margin:0"><option value="">All Classes</option>${(CACHE.classes||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
 <select id="sb" style="max-width:180px;margin:0"><option value="">All Batches</option>${(CACHE.batches||[]).map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select>
 <button class="btn small" onclick="studentsView('search='+encodeURIComponent($('#sq').value)+'&status='+$('#sst').value+'&class_id='+$('#scl').value+'&batch_id='+$('#sb').value)">Search / Filter</button></div>
 <div class="card" style="overflow:auto"><table><tr><th>Student</th><th>Mobile</th><th>Status</th><th>Batch</th><th>Actions</th></tr>
 ${d.students.map(s=>`<tr><td><b>${esc(s.name)}</b><br><small class="muted">${esc((s.created_at||'').slice(0,10))}</small></td><td>${esc(s.mobile||'')}</td>
 <td><span class="badge ${s.status==='APPROVED'?'ok':s.status==='PENDING'?'warn':'bad'}">${s.status}</span></td>
 <td><select onchange="setStudent(${s.id},{batch_id:this.value?+this.value:null})" style="margin:0"><option value="">—</option>${CACHE.batches.map(b=>`<option value="${b.id}" ${s.batch_id===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></td>
 <td style="white-space:nowrap">${s.status!=='APPROVED'?`<button class="btn small" onclick="setStudent(${s.id},{status:'APPROVED'})">Approve</button>`:''}
 ${s.status==='PENDING'?`<button class="btn small danger" onclick="setStudent(${s.id},{status:'REJECTED'})">Reject</button>`:''}
 ${s.status==='APPROVED'?`<button class="btn small warn" onclick="setStudent(${s.id},{status:'BLOCKED'})">Block</button>`:s.status==='BLOCKED'||s.status==='SUSPENDED'?`<button class="btn small" onclick="setStudent(${s.id},{status:'APPROVED'})">Unblock</button>`:''}
 <button class="btn small secondary" onclick="revoke(${s.id})">Revoke Device</button> <button class="btn small secondary" onclick="stuProg(${s.id},'${escJs(s.name)}')">Progress</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No students found</td></tr>'}</table></div>`)}catch(e){toast(e.message)}}
async function setStudent(id,body){await api('/api/admin/students/'+id,{method:'PUT',body:JSON.stringify(body)});toast('Updated ✓');studentsView()}
async function revoke(id){await api('/api/admin/students/'+id+'/revoke-session',{method:'POST',body:'{}'});toast('Device session revoked ✓')}
async function stuProg(id,name){const d=await api('/api/admin/students/'+id+'/progress');
 modal(`<h3>📈 ${esc(name)}</h3><h4 style="margin:10px 0 6px">Lectures</h4>${d.watched.map(w=>`<p>${w.completed?'✅':'▶'} ${esc(w.title)} <small class="muted">(${w.position_sec}s)</small></p>`).join('')||'<p class="muted">None</p>'}
 <h4 style="margin:12px 0 6px">Test Results</h4>${d.results.map(r=>`<p>${esc(r.title)}: <b>${r.score}/${r.total}</b></p>`).join('')||'<p class="muted">None</p>'}<br><button class="btn secondary" onclick="closeModal()">Close</button>`)}

/* STRUCTURE CRUD */
function crudSection(title,items,fields,apiPath,extra=''){return `<div class="card"><h3>${title}</h3>
 <div class="row" style="flex-wrap:wrap">${fields}${extra}<button class="btn small" onclick="createItem('${apiPath}')">+ Add</button></div>
 ${items.map(it=>`<div class="row between" style="border-top:1px solid var(--line);padding:9px 0"><span>${it._label}</span><span>
 <button class="btn small secondary" onclick="renameItem('${apiPath}',${it.id},'${escJs(it.name)}')">Edit</button>
 <button class="btn small secondary" onclick="togglePub('${apiPath}',${it.id},${it.published?0:1})">${it.published?'Unpublish':'Publish'}</button>
 <button class="btn small danger" onclick="delItem('${apiPath}',${it.id})">Delete</button></span></div>`).join('')||'<p class="muted">None yet</p>'}</div>`}
async function structureView(){loading();await loadBase();
 const cls=CACHE.classes.map(c=>({...c,_label:`<b>${esc(c.name)}</b> ${c.published?'<span class="badge ok">Live</span>':'<span class="badge warn">Hidden</span>'}`}));
 const sbs=CACHE.subjects.map(s=>({...s,_label:`${esc(s.icon||'')} <b>${esc(s.name)}</b> <small class="muted">${esc((CACHE.classes.find(c=>c.id===s.class_id)||{}).name||'')}</small>`}));
 const chs=CACHE.chapters.map(c=>({...c,_label:`<b>${esc(c.name)}</b> <small class="muted">${esc((CACHE.subjects.find(s=>s.id===c.subject_id)||{}).name||'')}</small>`}));
 main(`<h1>🗂 Classes, Subjects & Chapters</h1><p class="muted" style="margin-bottom:12px">Order (sort) controls display sequence in the student app.</p>
 ${crudSection('🏫 Classes',cls,`<input id="f-classes-name" placeholder="Class name e.g. Class 10" style="max-width:220px;margin:0"><input id="f-classes-sort" type="number" value="0" style="max-width:80px;margin:0">`,'classes')}
 ${crudSection('📚 Subjects',sbs,`<select id="f-subjects-class_id" style="max-width:170px;margin:0">${CACHE.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><input id="f-subjects-name" placeholder="Subject e.g. Mathematics" style="max-width:200px;margin:0"><input id="f-subjects-icon" placeholder="📐" style="max-width:70px;margin:0"><input id="f-subjects-sort" type="number" value="0" style="max-width:80px;margin:0">`,'subjects')}
 ${crudSection('📖 Chapters',chs,`<select id="f-chapters-subject_id" style="max-width:220px;margin:0">${CACHE.subjects.map(s=>`<option value="${s.id}">${esc((CACHE.classes.find(c=>c.id===s.class_id)||{}).name||'')} › ${esc(s.name)}</option>`).join('')}</select><input id="f-chapters-name" placeholder="Chapter name" style="max-width:220px;margin:0"><input id="f-chapters-sort" type="number" value="0" style="max-width:80px;margin:0">`,'chapters')}`)}
async function createItem(t){const body={published:1};document.querySelectorAll(`[id^="f-${t}-"]`).forEach(el=>{const k=el.id.replace(`f-${t}-`,'');body[k]=el.type==='number'?+el.value:(k.endsWith('_id')?+el.value:el.value)});
 if(!body.name)return toast('Enter a name');await api('/api/admin/'+t,{method:'POST',body:JSON.stringify(body)});toast('Added ✓');structureView()}
async function renameItem(t,id,cur){const n=prompt('Edit name:',cur);if(n){await api(`/api/admin/${t}/${id}`,{method:'PUT',body:JSON.stringify({name:n})});structureView()}}
async function togglePub(t,id,v){await api(`/api/admin/${t}/${id}`,{method:'PUT',body:JSON.stringify({published:v})});structureView()}
async function delItem(t,id){if(confirm('Delete this item? Related items under it will also be removed.')){await api(`/api/admin/${t}/${id}`,{method:'DELETE'});toast('Deleted');VIEW==='structure'?structureView():batchesView()}}

/* BATCHES */
async function batchesView(){loading();await loadBase();
 main(`<h1>👥 Batches</h1><div class="card"><div class="row" style="flex-wrap:wrap"><input id="bn" placeholder="Batch name e.g. Class 10 Batch" style="max-width:240px;margin:0">
 <select id="bc" style="max-width:180px;margin:0"><option value="">No class link</option>${CACHE.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
 <button class="btn small" onclick="addBatch()">+ Create Batch</button></div>
 ${CACHE.batches.map(b=>`<div class="row between" style="border-top:1px solid var(--line);padding:10px 0"><span><b>${esc(b.name)}</b> <span class="badge ${b.active?'ok':'warn'}">${b.active?'Active':'Inactive'}</span> <small class="muted">${esc(b.description||'')}</small></span>
 <span><button class="btn small secondary" onclick="toggleBatch(${b.id},${b.active?0:1})">${b.active?'Deactivate':'Activate'}</button>

async function doubtsAdmin(filter=''){loading();await ensureFileToken().catch(()=>{});const d=await api('/api/doubts');
 const list=d.doubts.filter(x=>!filter||x.status===filter);
 main(`<h1>💬 Student Doubts</h1><div class="row" style="margin:12px 0;flex-wrap:wrap">${['','PENDING','IN_PROGRESS','ANSWERED','RESOLVED'].map(f=>`<button class="btn small ${filter===f?'':'secondary'}" onclick="doubtsAdmin('${f}')">${f||'All'}</button>`).join(' ')}</div>
 ${list.map(x=>`<div class="card"><div class="row between"><b>${esc(x.student_name)}</b><span class="badge ${x.status==='RESOLVED'?'ok':x.status==='PENDING'?'warn':''}">${x.status.replace('_',' ')}</span></div>
 <p style="margin:8px 0">${esc(x.question)}</p>${x.image?`<img src="${esc(imgUrl(x.image))}" style="max-width:320px;border-radius:12px">`:''}<p class="muted">${esc(x.created_at)}</p>
 ${x.replies.map(r=>`<div style="border-left:3px solid ${r.author_role==='STUDENT'?'var(--line)':'var(--brand)'};padding:6px 10px;margin:8px 0"><b>${r.author_role==='STUDENT'?esc(x.student_name):'Dream Sir'}:</b> ${esc(r.text)}${r.image?`<br><img src="${esc(imgUrl(r.image))}" style="max-width:280px;border-radius:10px;margin-top:6px">`:''}${r.pdf?`<br><a href="${esc(imgUrl(r.pdf))}" target="_blank">📄 PDF Solution</a>`:''}</div>`).join('')}
 <label>Your Answer</label><textarea id="ar-${x.id}" rows="2" placeholder="Explain the solution…"></textarea>
 <label>Attach solution image (optional)</label><input type="file" id="ai-${x.id}" accept="image/*">
 <label>Attach PDF solution (optional)</label><input type="file" id="ap-${x.id}" accept="application/pdf">
 <div class="row"><button class="btn small" onclick="answerDoubt(${x.id},'ANSWERED')">Send Answer ✓</button>
 <button class="btn small secondary" onclick="answerDoubt(${x.id},'IN_PROGRESS')">Mark In Progress</button>
 <button class="btn small secondary" onclick="setDStatus(${x.id},'${x.status==='RESOLVED'?'PENDING':'RESOLVED'}')">${x.status==='RESOLVED'?'Reopen':'Resolve'}</button></div></div>`).join('')||'<div class="empty"><div class="big">💬</div><p>No doubts here.</p></div>'}`)}
async function answerDoubt(id,st){const f=new FormData();f.append('text',$('#ar-'+id).value);f.append('status',st);const img=$('#ai-'+id).files[0];if(img)f.append('image',img);const pdf=$('#ap-'+id)?.files?.[0];if(pdf)f.append('pdf',pdf);
 await api('/api/doubts/'+id+'/reply',{method:'POST',body:f});toast('Reply sent ✓ Student notified in-app');doubtsAdmin()}
async function setDStatus(id,s){await api('/api/doubts/'+id+'/status',{method:'PUT',body:JSON.stringify({status:s})});doubtsAdmin()}

/* NOTIFICATIONS */
async function notifyView(){loading();await loadBase();const [h,annSt]=await Promise.all([api('/api/admin/notifications'),api('/api/admin/students')]);
 main(`<h1>🔔 Notification Center</h1><div class="card"><h3>Send Notification</h3>
 <label>Title</label><input id="nt" placeholder="e.g. Chapter 3 Notes Uploaded!">
 <label>Message</label><textarea id="nm" rows="2" placeholder="New notes are available in My Classes…"></textarea>
 <label>Send To</label><select id="ntype" onchange="ntarget()"><option value="ALL">All Students</option><option value="BATCH">A Batch</option><option value="CLASS">A Class</option><option value="STUDENT">One Student</option></select>
 <select id="ntid" style="display:none"></select>
 <label>Schedule (optional — leave empty to send now)</label><input id="nsch" type="datetime-local">
 <div class="card" style="background:var(--bg)"><small class="muted">PREVIEW</small><p><b id="pvT">Title</b><br><span id="pvM" class="muted">Message…</span></p></div>
 <button class="btn" onclick="sendNotif()">Send Notification ✓</button>
 <p class="muted" style="margin-top:8px;font-size:.8rem">Delivered in-app + as a phone push alert (Web Push) to students who enabled notifications on their device. Scheduled messages send automatically.</p></div>
 <div class="card"><h3>📢 Post Announcement (shown on student Home)</h3><label>Title</label><input id="at"><label>Message</label><textarea id="ab" rows="2"></textarea>
 <button class="btn" onclick="postAnn()">Post Announcement</button></div>
 <div class="card"><h3>History</h3>${h.items.map(n=>`<p style="margin-top:7px"><b>${esc(n.title)}</b> → ${esc(n.target_type)} <span class="badge ${n.status==='SCHEDULED'?'warn':'ok'}">${n.status}${n.scheduled_at?' · '+esc(n.scheduled_at):''}</span><br><small class="muted">${esc(n.message)} · ${esc(n.created_at)}</small></p>`).join('')||'<p class="muted">None yet</p>'}</div>`);
 $('#nt').oninput=e=>$('#pvT').textContent=e.target.value||'Title';$('#nm').oninput=e=>$('#pvM').textContent=e.target.value||'Message…';
 window._students=annSt.students}
function ntarget(){const t=$('#ntype').value,s=$('#ntid');if(t==='ALL'){s.style.display='none';return}s.style.display='block';
 const src=t==='BATCH'?CACHE.batches:t==='CLASS'?CACHE.classes:(window._students||[]);
 s.innerHTML=src.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
async function sendNotif(){if(!confirm('Send this notification now?'))return;
 const sch=$('#nsch').value;
 const d=await api('/api/admin/notifications',{method:'POST',body:JSON.stringify({title:$('#nt').value,message:$('#nm').value,target_type:$('#ntype').value,target_id:$('#ntype').value==='ALL'?null:+$('#ntid').value,scheduled_at:sch?new Date(sch).toISOString():null})});
 toast((sch?'Scheduled':'Sent')+' ✓ → '+(d.recipients??'')+' student(s)');notifyView()}
async function postAnn(){await api('/api/admin/announcements',{method:'POST',body:JSON.stringify({title:$('#at').value,body:$('#ab').value})});toast('Announcement posted ✓')}

/* SETTINGS */
async function settingsView(){loading();await ensureFileToken().catch(()=>{});const s=await api('/api/admin/settings');
 const cfg=await api('/api/admin/config-status').catch(()=>({warnings:[]}));
 const cfgCard=cfg.warnings?.length?`<div class="card" style="background:#fef3c7;border-color:#f59e0b;color:#231300"><h3>⚠️ Production Configuration Warnings</h3>${cfg.warnings.map(w=>`<p style="margin-top:6px">• ${esc(w)}</p>`).join('')}<p style="margin-top:8px"><small>OTP mode: ${esc(cfg.otpMode||'')} · Push ready: ${cfg.webPushReady?'Yes':'No'} · HTTPS: ${cfg.https?'Yes':'No'} · See PRODUCTION.md / .env.example in the project.</small></p></div>`:`<div class="card"><h3>✅ Production Configuration</h3><p class="muted">No configuration warnings. OTP: ${esc(cfg.otpMode||'')} · HTTPS: ${cfg.https?'Yes':'No'}</p></div>`;
 let teachers='';if(USER.role==='SUPER_ADMIN'){const t=await api('/api/admin/teachers');
  teachers=`<div class="card"><h3>👩‍🏫 Teachers</h3>${t.items.map(x=>`<p style="margin-top:6px">${esc(x.name)} — ${esc(x.email)} <span class="badge">${x.role}</span></p>`).join('')}
  <div class="row" style="flex-wrap:wrap;margin-top:12px"><input id="tn" placeholder="Teacher name" style="max-width:180px;margin:0"><input id="te" placeholder="Email" style="max-width:200px;margin:0"><input id="tp" type="password" placeholder="Password (12+ characters)" style="max-width:160px;margin:0"><button class="btn small" onclick="addTeacher()">+ Add Teacher</button></div></div>`}
 main(`<h1>⚙️ Settings</h1>${cfgCard}<div class="card"><h3>Student Registration Approval</h3>
 <p class="muted">MANUAL = Dream Sir approves each new student. AUTO = students get instant access after OTP.</p>
 <select id="appr"><option value="MANUAL" ${s.approval_mode==='MANUAL'?'selected':''}>Manual Approval (recommended)</option><option value="AUTO" ${s.approval_mode==='AUTO'?'selected':''}>Automatic Approval</option></select>
 <button class="btn" onclick="saveSettings()">Save Settings ✓</button></div>${teachers}
 <div class="card"><h3>🔐 Change My Password</h3>
 <label>Current Password</label><input id="cp1" type="password"><label>New Password (min 12 characters)</label><input id="cp2" type="password">
 <button class="btn" onclick="changePw()">Change Password</button><p class="muted" style="margin-top:6px">You will be logged out after changing.</p></div>
 ${USER.role==='SUPER_ADMIN'?`<div class="card"><h3>💾 Database Backup</h3><p class="muted">Download a full copy of the database file. Store it safely; also back up the <b>uploads/</b> folder on the server.</p>
 <a class="btn small" style="text-decoration:none;display:inline-block;width:auto;margin-top:8px" href="${esc(B(`/api/admin/backup.db?ft=${encodeURIComponent(FILE_TOKEN)}`))}">Download Backup (.db)</a></div>`:''}
 <div class="card"><h3>ℹ️ Institute</h3><p><b>Dream Classes</b> · Dream Sir<br>Kothwara, Dobhi, Gaya, Bihar, India<br>Panel login: ${esc(USER.email||'')} (${USER.role})</p>
 <p class="muted" style="margin-top:8px">Production checklist (SMS/WhatsApp OTP, Firebase push, domain, APK) — see README in project folder.</p></div>`)}
async function changePw(){try{await api('/api/admin/change-password',{method:'POST',body:JSON.stringify({current:$('#cp1').value,next:$('#cp2').value})});toast('Password changed. Please login again');setTimeout(logout,1200)}catch(e){toast(e.message)}}
async function saveSettings(){await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({approval_mode:$('#appr').value})});toast('Settings saved ✓')}

async function addTeacher(){try{await api('/api/admin/teachers',{method:'POST',body:JSON.stringify({name:$('#tn').value,email:$('#te').value,password:$('#tp').value})});toast('Teacher added ✓');settingsView()}catch(e){toast(e.message)}}

async function boot(){if(!TOKEN)return loginView();try{const d=await api('/api/auth/me');USER=d.user;if(USER.role==='STUDENT')throw new Error('x');await ensureFileToken().catch(()=>{});shell();go('dash')}catch{TOKEN='';FILE_TOKEN='';localStorage.removeItem('dc_admin');loginView()}}
boot();
</script></body></html>
