name: Build Indian Bus Simulator 3D APK

# Builds the Android APK for the Indian Bus Simulator 3D game.
# The APK is attached to the run and published to the "bus-sim-apk" release.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "indian-bus-simulator/**"
      - ".github/workflows/build-bus-sim-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: indian-bus-simulator
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            indian-bus-simulator/android/*.gradle*
            indian-bus-simulator/android/app/*.gradle*

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: indian-bus-simulator/package-lock.json

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run unit + integration tests
        run: npm test

      - name: Install dependencies
        run: npm ci

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK (Gradle)
        working-directory: indian-bus-simulator/android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::Gradle build failed — key lines:"
            grep -aiE "error:|e: file|FAILURE:|What went wrong|Execution failed|AAPT|not found|requires|failed to" /tmp/gradle.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:280}"; done
          fi
          exit $code

      - name: Verify APK contents
        working-directory: indian-bus-simulator/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT" dump badging "$APK" | grep -E "^package:|^application-label:|launchable-activity" | while IFS= read -r l; do echo "::notice::$l"; done
          unzip -l "$APK" | grep -q "assets/public/index.html" || { echo "::error::Game web assets missing from APK!"; exit 1; }
          unzip -l "$APK" | grep -q "assets/public/vendor/three.module.js" || { echo "::error::Three.js bundle missing from APK!"; exit 1; }
          unzip -l "$APK" | grep -q "assets/public/js/main.js" || { echo "::error::Game entry point missing from APK!"; exit 1; }
          echo "::notice::APK bundle verified: html + three.js + game entry present"

      - name: Publish build report to the run summary
        working-directory: indian-bus-simulator/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          {
            echo "## 📦 Indian Bus Simulator 3D — APK build report"
            echo ""
            echo "**APK:** \`app/build/outputs/apk/debug/app-debug.apk\`"
            ls -lh "$APK" | awk '{print "**Size:** " $5}'
            echo ""
            echo "### Package"
            echo '```'
            "$AAPT" dump badging "$APK" | grep -E "^package:|^application-label:|^launchable-activity:|^sdkVersion:|^targetSdkVersion:|uses-feature|uses-permission" | head -12
            echo '```'
            echo ""
            echo "### Bundled game assets"
            echo '```'
            unzip -l "$APK" | grep -E "assets/public/(index.html|css/style.css|js/main.js|vendor/three.module.js)" | awk '{print $1, $4}'
            echo '```'
            echo ""
            echo "### Checks"
            echo "- [x] Gradle assembleDebug"
            echo "- [x] npm test (unit + integration)"
            echo "- [x] index.html / three.js / main.js present in the APK"
          } | tee "$GITHUB_STEP_SUMMARY" > /tmp/apk-report.md

      - name: Publish the build report to the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/apk-report.md ]; then
            echo "no report file"
            exit 0
          fi
          {
            echo "### Build \`${GITHUB_SHA:0:7}\`"
            echo ""
            cat /tmp/apk-report.md
          } > /tmp/apk-report-body.md
          NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
            --jq '[.[] | select(.title == "[apk-build-report] Indian Bus Simulator 3D")] | .[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" \
              --method POST --field body="$(cat /tmp/apk-report-body.md)" > /dev/null
            echo "commented on issue ${NUMBER}"
          else
            gh issue create --title "[apk-build-report] Indian Bus Simulator 3D" \
              --body-file /tmp/apk-report-body.md
          fi

      - name: Prepare friendly APK file
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/IndianBusSimulator3D-v1.0-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/IndianBusSimulator3D-v1.0-debug.apk"

      - name: Upload APK (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: Indian-Bus-Simulator-3D-APK
          path: IndianBusSimulator3D-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bus-sim-apk
          name: Indian Bus Simulator 3D (Android APK)
          body: |
            🚌 **Indian Bus Simulator 3D** — offline 3D bus driving game for Android.

            📥 Download `IndianBusSimulator3D-v1.0-debug.apk` and install it on your phone
            (allow "install unknown apps" for your file manager when prompted).

            Landscape orientation · fully offline · 8 buses · 7 maps · career mode,
            free drive, traffic AI, passengers, weather, day/night and bus customisation.
          files: IndianBusSimulator3D-v1.0-debug.apk
          make_latest: false
