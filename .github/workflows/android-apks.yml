name: Build Android APKs
on:
  workflow_dispatch:
  push:
    branches: [arena/f7d29d7e-ppp]
    paths: ['**/*.kt', '**/*.kts', 'gradle.properties', '.github/workflows/android-apks.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :teacherApp:assembleDebug :studentApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dream-classes-apks
          if-no-files-found: error
          path: |
            teacherApp/build/outputs/apk/debug/teacherApp-debug.apk
            studentApp/build/outputs/apk/debug/studentApp-debug.apk
