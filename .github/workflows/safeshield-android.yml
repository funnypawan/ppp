name: SafeShield Android
on:
  workflow_dispatch:
  push:
    paths: ['safeshield/**', '.github/workflows/safeshield-android.yml']
  pull_request:
    paths: ['safeshield/**', '.github/workflows/safeshield-android.yml']
permissions:
  contents: write
  checks: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: safeshield
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK packages using runner's preinstalled tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"' 
      - run: ./tests/run.sh
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build-report.txt
      - name: Publish failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build-report.txt ]; then
            python3 - <<'PYCODE'
          import json, os
          text=open('build-report.txt').read()[-45000:]
          payload={'name':'Build diagnostics','head_sha':os.environ['GITHUB_SHA'],'status':'completed','conclusion':'failure','output':{'title':'Gradle build output','summary':'```text\n'+text+'\n```'}}
          open('/tmp/check.json','w').write(json.dumps(payload))
          PYCODE
            gh api "repos/$GITHUB_REPOSITORY/check-runs" --input /tmp/check.json || true
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: safeshield-debug
          path: safeshield/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish downloadable debug APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SafeShield-debug.apk
          TAG="safeshield-debug-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" SafeShield-debug.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "SafeShield debug build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK for testing only. Not independently device-tested or certified production-ready. DNS filtering does not block all images, videos or bypasses. See safeshield/TESTING.md."
