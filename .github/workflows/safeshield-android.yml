name: SafeShield Android
on:
  workflow_dispatch:
  push:
    paths: ['safeshield/**', '.github/workflows/safeshield-android.yml']
  pull_request:
    paths: ['safeshield/**', '.github/workflows/safeshield-android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: safeshield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./tests/run.sh
      - run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: safeshield-debug
          path: safeshield/app/build/outputs/apk/debug/app-debug.apk
