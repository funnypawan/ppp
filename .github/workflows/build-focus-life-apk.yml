name: Build FOCUS LIFE APK

on:
  workflow_dispatch:
  push:
    branches: ["arena/bd56d3fc-ppp", "main"]
    paths:
      - "focus-life/**"
      - ".github/workflows/build-focus-life-apk.yml"

permissions:
  contents: write
  issues: write

jobs:
  build-apk:
    name: Build FOCUS LIFE debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: focus-life
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            focus-life/*.gradle*
            focus-life/app/*.gradle*

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          which sdkmanager
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK (Gradle)
        working-directory: focus-life
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle-focus.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::Gradle build failed — key lines:"
            grep -aiE -A4 -B1 "error:|e: file|FAILURE:|What went wrong|Execution failed|A problem occurred|Caused by|AAPT|not found|requires|failed to|Unresolved|Cannot find|duplicate|manifest merger" /tmp/gradle-focus.log | head -45 | while IFS= read -r l; do echo "::error::${l:0:280}"; done
          fi
          exit $code

      - name: Run unit tests
        working-directory: focus-life
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Report build log as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Gradle failure log (run ${{ github.run_number }}, sha ${{ github.sha }})";
            echo;
            echo "<details><summary>Last 300 lines / 90 KB of build log</summary>";
            echo;
            echo '```';
            tail -c 90000 /tmp/gradle-focus.log | tail -n 300;
            echo '```';
            echo "</details>";
          } > /tmp/issue-body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "FOCUS LIFE build failure (run ${{ github.run_number }})" --body-file /tmp/issue-body.md || echo "could not create issue"

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-focus-log
          path: /tmp/gradle-focus.log
          retention-days: 7

      - name: Verify APK
        working-directory: focus-life
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          "$AAPT" dump badging "$APK" | grep -E "^package:|^application-label:|^launchable-activity:" | while IFS= read -r l; do echo "::notice::$l"; done

      - name: Prepare friendly APK file
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FocusLife-v1.0-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/FocusLife-v1.0-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLife-APK
          path: FocusLife-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: focus-life-apk-latest
          name: FOCUS LIFE Android App (APK Download)
          body: |
            🎯 **FOCUS LIFE** — Personal Discipline & Distraction Control (Android 10+)

            📥 Install: download **FocusLife-v1.0-debug.apk** below, tap it, allow "unknown apps" if asked, then Install.

            ℹ️ Debug build, offline-first, no ads. See `focus-life/PERMISSIONS.md` for Usage Access + Accessibility setup.
          files: FocusLife-v1.0-debug.apk
          make_latest: true

      - name: Close stale build-failure issues
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'FOCUS LIFE build failure in:title' --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Fixed — this workflow run succeeded and the APK is published to release focus-life-apk-latest." || true
          done
