name: Unity compile check (C# core)

on:
  push:
    branches:
      - main
      - arena/**
  pull_request:
    paths:
      - "unity/**"
      - ".github/workflows/unity-compile-check.yml"

permissions:
  contents: read
  issues: write

jobs:
  compile-check:
    name: Type check Unity scripts and run the C# core suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show SDK info
        run: dotnet --info

      - name: Build + run the compile check harness
        working-directory: unity/IndianBusSimulator/Tools/CompileCheck
        run: |
          set +e
          dotnet build CompileCheck.csproj -c Release --nologo > /tmp/build.log 2>&1
          BUILD=$?
          dotnet run --project CompileCheck.csproj -c Release --no-build > /tmp/run.log 2>&1
          RUN=$?
          {
            echo "## Unity C# compile check"
            echo ""
            echo "### dotnet build (exit \`$BUILD\`)"
            echo '```'
            cat /tmp/build.log
            echo '```'
            echo ""
            echo "### regression suite (exit \`$RUN\`)"
            echo '```'
            cat /tmp/run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BUILD" -ne 0 ]; then exit "$BUILD"; fi
          exit "$RUN"

      - name: Publish diagnostics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const build = fs.existsSync('/tmp/build.log') ? fs.readFileSync('/tmp/build.log', 'utf8') : 'no build log';
            const run = fs.existsSync('/tmp/run.log') ? fs.readFileSync('/tmp/run.log', 'utf8') : 'no run log';
            const sha = context.sha.slice(0, 7);
            const body = [
              `### Unity C# compile check - \`${sha}\``,
              '',
              '#### dotnet build',
              '```',
              build.slice(-6000),
              '```',
              '',
              '#### regression suite',
              '```',
              run.slice(-4000),
              '```'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[compile-check] ${sha}`,
              body
            });
