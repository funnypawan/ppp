name: Build FocusLock APK

# Builds the FocusLock debug APK on GitHub's cloud runners and publishes it
# to a GitHub Release, so it can be downloaded & installed directly:
# https://github.com/funnypawan/ppp/releases/download/focuslock-apk-v1.0.0/FocusLock-v1.0.0.apk

on:
  push:
    branches: [arena/79f0e7b5-ppp]
    paths:
      - 'FocusLock/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: FocusLock
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Run unit tests (non-blocking)
        working-directory: FocusLock
        continue-on-error: true
        run: ./gradlew testDebugUnitTest

      - name: Prepare APK for publishing
        run: |
          cp FocusLock/app/build/outputs/apk/debug/app-debug.apk FocusLock-v1.0.0.apk
          ls -lh FocusLock-v1.0.0.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-APK
          path: FocusLock-v1.0.0.apk

      - name: Publish APK to GitHub Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: focuslock-apk-v1.0.0
          name: "FocusLock v1.0.0 APK – Smart App Time Limiter"
          body: |
            📱 **FocusLock-v1.0.0.apk** download karke seedha install karo (Android 8.0+ / API 26+).

            **Features:** har installed app ke liye alag daily time limit, real app blocking, Emergency Access (roz 3 sessions × 10 minute), Strict Mode PIN, usage statistics, exempt apps, protection schedule, break mode.

            **Install notes:** Pehli baar install par "Install unknown apps" allow karna pad sakta hai. App kholkar Usage Access + Accessibility ka permission setup complete karein (app khud guide karega).

            Developed by ronny raj (funnypawan8@gmail.com)
          files: FocusLock-v1.0.0.apk
