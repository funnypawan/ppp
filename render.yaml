# Dream Classes server ko Render par deploy karne ke liye.
# Render Dashboard -> New -> Blueprint -> ye GitHub repo chunein.
#
# IMPORTANT storage note:
# Free plan par disk temporary hoti hai — restart/redeploy par database aur
# uploads mit sakte hain. Asli students ke liye paid service + Persistent Disk
# jodein, disk ka Mount Path /var/data rakhein, phir STORAGE_DIR env me
# /var/data/dream-classes set karein. Code database ko STORAGE_DIR/data aur
# uploads ko STORAGE_DIR/uploads me rakhega.
services:
  - type: web
    name: dream-classes
    env: node
    rootDir: dream-classes
    buildCommand: npm ci
    startCommand: node seed.js && node server.js
    plan: free
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@dreamclasses.in
      - key: ADMIN_PASSWORD
        sync: false      # Render aapse puchega — 12+ characters ka strong password dein
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: OTP_MODE
        value: production
      # Persistent Disk jodne ke baad hi /var/data/dream-classes bharein.
      - key: STORAGE_DIR
        sync: false
      # Sirf EK SMS provider bharein. Khaali rehne par OTP surakshit roop se
      # "not configured" kahega; demo OTP production me kabhi nahi dikhega.
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: TWOFACTOR_API_KEY
        sync: false
      - key: TWOFACTOR_TEMPLATE_NAME
        sync: false
